name: Validated SORC Pages deployment
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: sorc-pages-validated
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Tunga0412/sorctracks-publication-qa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out this exact public test commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.16'
      - name: Validate and package only the public rehearsal files
        run: python automation/qa_gate.py --source . --output "$RUNNER_TEMP/validated-site"
      - name: Upload only validated static content
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/validated-site
          retention-days: 1
  deploy-validated-site:
    name: deploy-validated-site
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://tunga0412.github.io/sorctracks-publication-qa/
    steps:
      - name: Deploy validated public rehearsal
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          timeout: '240000'
